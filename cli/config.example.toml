# 配置说明：复制此文件为 config.toml 并填入你的配置
# 原配置位于 ~/.llm_harness/config.toml

[defaults]
model = "deepseek-chat"          # 默认模型（支持 provider:model 格式）
thinking = "off"                 # 思考档位：off | low | medium | high
context_window = 262144          # 上下文窗口（token）
compress_threshold = 0.75        # 低于此比例自动压缩历史
compress_keep_last = 20          # 压缩时保留最近 N 条消息
max_input = 20000                # 单次输入 token 上限
max_tokens = 25000               # 单次输出 token 上限
search_provider = "firecrawl"    # 联网搜索：firecrawl | tavily
firecrawl_api_key = ""           # Firecrawl 联网搜索 key（https://firecrawl.dev 获取）
tavily_api_key = ""              # Tavily 备用搜索 key（https://tavily.com 获取）
system_prompt = "You are a helpful, friendly AI assistant. 回答一律使用中文（除非用户明确要求其他语言）。回答要准确、直接、友好。对于需要外部事实支撑的问题，优先联网核实并基于可靠来源作答；不要凭记忆猜测或编造。"

# 多供应商配置：同 URL 不同模型可放同一 provider
[[providers]]
name = "deepseek"
base_url = "https://api.deepseek.com/v1"
api_key_env = "DEEPSEEK_API_KEY"  # 留空则使用 api_key 字段
models = ["deepseek-chat", "deepseek-reasoner"]

[[providers]]
name = "ollama"
base_url = "http://localhost:11434/v1"
api_key_env = ""
models = ["qwen2.5:7b", "llama3.1:8b"]

[[providers]]
name = "openai"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
models = ["gpt-4o", "gpt-4o-mini"]
