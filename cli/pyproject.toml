[project]
name = "llm-harness"
version = "0.1.0"
description = "Lightweight terminal LLM harness: streaming chat, thinking levels, images, multi-conversation, context compression."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
    "prompt_toolkit>=3.0",
    "pillow>=10.0",
]

# 附件文本提取（PDF/docx/xlsx）：pip install -e ".[files]"
[project.optional-dependencies]
files = [
    "pypdf>=4.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
]

[project.scripts]
llm-harness = "llm_harness.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["llm_harness*"]
