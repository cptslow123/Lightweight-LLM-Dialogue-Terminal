# 复制为 ~/.llm_harness/config.toml 使用
[defaults]
model = "deepseek-chat"
thinking = "off"            # off | low | medium | high
context_window = 262144     # 总上下文窗口（token），按模型真实值填
compress_threshold = 0.75   # 上下文占用超过窗口的此比例时自动压缩
compress_keep_last = 20     # 压缩时保留最近 N 条完整消息
max_input = 10000            # 单次请求输入上限
max_tokens = 20000           # 单次回复最大输出 token
tavily_api_key = ""            # Tavily 联网搜索 key（https://tavily.com 获取），/setting 可配置
system_prompt = "You are a helpful, friendly AI assistant. 回答一律使用中文（除非用户明确要求其他语言）。回答要准确、直接、友好；对于时效性、实时性信息（新闻、天气、价格、最新事件等），不确定时不要编造，可以通过联网搜索获取最新信息后作答。"

# 可配多个 provider，/model 或启动参数 --provider 切换
[[providers]]
name = "deepseek"
base_url = "https://api.deepseek.com/v1"
api_key_env = "DEEPSEEK_API_KEY"   # 留空则不带鉴权头
models = ["deepseek-chat", "deepseek-reasoner"]

[[providers]]
name = "ollama"
base_url = "http://localhost:11434/v1"
api_key_env = ""
models = ["qwen2.5:7b", "llama3.1:8b"]
